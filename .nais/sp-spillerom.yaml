apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: sp-spillerom
  namespace: tbd
  annotations:
    snorlax.nais.io/enabled: 'false'
  labels:
    team: tbd
spec:
  port: 3000
  ingresses:
    - https://spillerom.ekstern.dev.nav.no
  replicas:
    min: 2
    max: 3
    scalingStrategy:
      cpu:
        thresholdPercentage: 90
  preStopHook:
    http:
      path: /api/internal/preStop
      port: 3000
  observability:
    logging:
      destinations:
        - id: loki
        - id: elastic
  accessPolicy:
    outbound:
      external:
        - host: bakrommet-demo.ekstern.dev.nav.no
  resources:
    limits:
      memory: 350Mi
    requests:
      cpu: 50m
      memory: 256Mi
  liveness:
    path: /api/internal/isAlive
  readiness:
    path: /api/internal/isAlive
  startup:
    path: /api/internal/isAlive
    initialDelay: 10
